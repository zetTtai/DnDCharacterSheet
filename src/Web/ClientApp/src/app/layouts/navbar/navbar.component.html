<nav id="pc-navbar" class="ui navbar navbar-expand-sm navbar-toggleable-sm navbar-light border box-shadow">
  <div class="nav-container-pc">
    <div id="nav-start">
      <a class="navbar-brand" [routerLink]="['/']">
        <img id="logo" src="assets/images/icon192x192.png" alt="{{ 'title' | translate }}" title="{{ 'title' | translate }}" />
        <div class="current-lang">
          <app-icon [name]="'lang/' + getCurrentLanguage()" [width]="currentLangSize" [height]="currentLangSize"></app-icon>
        </div>
        <!-- Div to fill the gap between image and langs due to navbar padding -->
        <div class="lang-gap"></div>

        <div class="ui langs">
          <ng-container *ngFor="let iso of getSupportedLanguages()">
            <div class="lang" title="{{ 'lang.' + iso  | translate }}" (click)="switchLanguage(iso)">
              <app-icon [name]="'lang/' + iso" [width]="langSize" [height]="langSize"></app-icon>
            </div>
          </ng-container>
        </div>
      </a>
    </div>
    <div class="nav-end">
      <ul class="navbar-nav flex-grow">
        <li class="nav-item">
          <a class="nav-link text-dark prevent-select" [routerLink]="['/about-us']">{{ 'about-us.title' | translate }}</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-dark prevent-select" href="/api" target="_blank">API</a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-dark prevent-select" href="javascript:void(0)" (click)="toggleAccount()">{{ 'nav-menu.account' | translate }}</a>
        </li>
      </ul>
    </div>
  </div>
  <nav class="nav-container-mobile">
    <ul>
      <ng-container *ngFor="let component of components; index as index;">
        <li [id]="component.id" class="prevent-select" [class.selected]="index == getCurrentView()" (click)="mobileSlide(index)">
          <app-icon [name]="component.id" [height]="defaultIconSize" [width]="defaultIconSize"></app-icon>
        </li>
      </ng-container>
    </ul>
  </nav>
</nav>
