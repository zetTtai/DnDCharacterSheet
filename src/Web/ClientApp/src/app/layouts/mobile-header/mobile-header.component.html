<nav id="mobile-header" class="ui mobile navbar navbar-expand-sm navbar-toggleable-sm navbar-light border box-shadow">
  <div class="first header-container">
    <div class="level-up-button">
      <button class="btn btn-primary"> Level Up </button>
    </div>

    <div class="save-button">
      <button class="btn btn-success"> Save </button>
    </div>
  </div>

  <div id="mobile-header-img" class="mobile not-clickable">
    <div class="character-img circle circle-l">
      <app-circle [empty]=false [diameter]="50">
        <img src="assets/images/icon192x192.png" width="50" height="50" />
      </app-circle>
    </div>
  </div>

  <div class="second header-container">
    <div class="character-name-input ml-10">
      <app-form-field [label]="'character.name' | translate" name="character_name" value="" [class]="'col-md-1 mt-16'"></app-form-field>
    </div>

    <app-form-field [label]="'character.level' | translate" name="level" value="1" class="level-input" [class]="'fs-24'" [readOnly]="true"></app-form-field>

    <div class="mt-8 mr-10 race-class-container">
      <app-form-field [label]="'character.race' | translate" name="race" type="custom">
        <div content class="content">
          <app-circle id="race"></app-circle>
        </div>
      </app-form-field>

      <app-form-field [label]="'character.classes' | translate" name="classes" type="custom" [last]="true">
        <div content class="class-input content" [style.max-width]="maxWidth">
          <app-circle id="first"></app-circle>
          <app-circle id="second"></app-circle>
          <app-circle id="add-class" [empty]=false>
            <app-icon [name]="'plus-outline'"></app-icon>
          </app-circle>
        </div>
      </app-form-field>
    </div>

  </div>

</nav>

<div id="toggle-header" class="mobile toggle-button-transition toggle-button-container">
  <app-toggle-button [bottom]="true" (click)="toggleHeader()">
    <ng-container *ngIf="!isHeaderOpen; else collapseHeader">
      <app-icon [name]="'plus-outline'" [width]="defaultIconSize" [height]="defaultIconSize"></app-icon>
    </ng-container>
    <ng-template #collapseHeader>
      <app-icon [name]="'minus-outline'" [width]="defaultIconSize" [height]="defaultIconSize"></app-icon>
    </ng-template>
  </app-toggle-button>

</div>
