<div class="abilities ui">
  <ng-container *ngFor="let ability of abilities">
    <div class="ability">
      <div class="header" *ngIf="isDesktop(); else mobileHeader">
        <span>{{ 'abilities.' + ability.id | translate }}</span>
      </div>

      <ng-template #mobileHeader>
        <div class="mobile-header" style="">
          <app-circle (click)="showAbilityInfo(ability.id)"
                      [empty]="false"
                      [diameter]="mobileInfoCircleSize"
                      [customClass]="'ui'">
            <app-icon [name]="'info/info'" [width]="mobileInfoIconSize" [height]="mobileInfoIconSize"></app-icon>
          </app-circle>
          <app-circle [empty]="false"
                      [diameter]="mobileAbilityCircleSize"
                      [customClass]="'ui'">
            <app-icon [name]="'abilities/_' + ability.id" [width]="mobileAbilityIconSize" [height]="mobileAbilityIconSize"></app-icon>
          </app-circle>
        </div>
      </ng-template>

      <div class="modifier">
        <span [id]="modifierPrefix + '-' + ability.id">
          <ng-container *ngIf="ability.score !== defaultValue">
            {{ getModifier(ability.score) }}
          </ng-container>
        </span>
      </div>

      <div class="score">
        <input class="ability-input no-spin"
               type="number"
               [id]="'score-' + ability.id"
               [name]="'score-' + ability.id"
               (input)="onScoreChange(ability, $event)"
               [value]="ability.score == defaultValue ? '' : ability.score" />
      </div>

    </div>
  </ng-container>
</div>
